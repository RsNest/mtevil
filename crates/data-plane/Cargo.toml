[package]
name = "mtevil-data-plane"
version = "0.1.0-alpha.1"
edition.workspace = true
description = "Test-only FakeTLS Direct proxy authorized by ADR-001"

[[bin]]
name = "mtevil"
path = "src/main.rs"

[dependencies]
mtevil-proto = { path = "../proto" }
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rand = "0.8"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
aes = "0.8"
hmac = "0.12"

[lints]
workspace = true
