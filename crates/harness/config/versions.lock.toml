notes = "Стенд Phase 0 разворачивается на выделенной VM (Ubuntu 26.04, cgroup v2, kernel 7.0); eBPF observer требует root (unprivileged_bpf_disabled=2)"

# Образы вспомогательных сервисов стенда (pull на VM 2026-11-17).
[stand_images]
python_client_stub = "python:3.13-alpine @ sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e"
nstat_observer_base = "alpine:3.21 + iproute2/util-linux/curl/jq (observer.Dockerfile)"
rst_observer_base = "ubuntu:26.04 + bpftrace из apt (rst-observer.Dockerfile); причина: bpftrace/bpftrace недоступен на docker hub и ghcr; 24.04 не знал BTF ядра 7.0"
rst_observer_note = "bpftrace из ubuntu:26.04 совместим с tracepoint-формами ядра 7.0 стенда (attach проверен smoke 2026-11-17)"

