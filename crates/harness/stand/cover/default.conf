# Cover — эталонный сайт (phase-0.md §2.1). Scaffold: статическая страница;
# полноценный эталон для family B/C сравнения — этап 3 §16 (реальный сайт-профиль).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
