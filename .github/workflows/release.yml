name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        run: |
          repo_lower=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="ghcr.io/${repo_lower}:${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags=$(printf "ghcr.io/%s:main\nghcr.io/%s:sha-%s" "$repo_lower" "$repo_lower" "$GITHUB_SHA")
          else
            tags=$(printf "ghcr.io/%s:%s\nghcr.io/%s:sha-%s" "$repo_lower" "$GITHUB_REF_NAME" "$repo_lower" "$GITHUB_SHA")
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/install.sh
            deploy/setup.py
          generate_release_notes: true
