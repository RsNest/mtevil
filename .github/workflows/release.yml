name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      announce_tag:
        description: "Announce an existing release in Telegram without rebuilding it"
        type: string
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: mtevil-release-pipeline
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish_img.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Run Rust tests and Clippy
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Resolve release version from pushed tag
        id: ver
        run: |
          git fetch origin main --tags --force
          repo_lower=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${repo_lower}" >> "$GITHUB_OUTPUT"

          tag="${GITHUB_REF_NAME}"
          python3 - "${tag}" <<'PY'
          import sys
          sys.path.insert(0, "deploy")
          import setup
          if setup.parse_semver_tag(sys.argv[1]) is None:
              raise SystemExit(f"Unsupported release tag: {sys.argv[1]}")
          PY
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${tag} for commit ${GITHUB_SHA}"

      - name: Build and test release Docker image
        id: build
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          repo_lower="${{ steps.ver.outputs.repo_lower }}"
          local_img="ghcr.io/${repo_lower}:${tag}"

          docker build \
            --build-arg MTEVIL_VERSION="${tag}" \
            --build-arg MTEVIL_REVISION="${GITHUB_SHA}" \
            -t "${local_img}" \
            .

          ver_out="$(docker run --rm "${local_img}" --version)"
          echo "Binary version output: ${ver_out}"
          test "${ver_out}" = "mtevil ${tag}"

          oci_ver="$(docker image inspect "${local_img}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          oci_rev="$(docker image inspect "${local_img}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "${oci_ver}" = "${tag}"
          test "${oci_rev}" = "${GITHUB_SHA}"

          MTEVIL_TEST_IMAGE="${local_img}" MTEVIL_REQUIRE_ALL_TESTS=1 python3 deploy/run_tests.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push GHCR images
        id: publish_img
        run: |
          repo_lower="${{ steps.ver.outputs.repo_lower }}"
          tag="${{ steps.ver.outputs.tag }}"
          final_img="ghcr.io/${repo_lower}:${tag}"

          sha_img="ghcr.io/${repo_lower}:sha-${GITHUB_SHA}"
          docker tag "${final_img}" "${sha_img}"
          docker push "${final_img}"
          docker push "${sha_img}"

          # Update :main only if GITHUB_SHA is not behind origin/main and tag is stable.
          is_pre="$(python3 - "${tag}" <<'PY'
          import sys
          sys.path.insert(0, "deploy")
          import setup
          print("true" if setup.is_prerelease_tag(sys.argv[1]) else "false")
          PY
          )"
          if [ "${is_pre}" = "false" ]; then
            git fetch origin main
            origin_main_sha="$(git rev-parse origin/main)"
            if git merge-base --is-ancestor "${origin_main_sha}" "${GITHUB_SHA}"; then
              main_img="ghcr.io/${repo_lower}:main"
              docker tag "${final_img}" "${main_img}"
              docker push "${main_img}"
            fi
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${final_img}" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous GHCR pull before release publication
        run: |
          anon_cfg="$(mktemp -d)"
          trap 'rm -rf "$anon_cfg"' EXIT
          DOCKER_CONFIG="$anon_cfg" docker pull "${{ steps.publish_img.outputs.image }}"

      - name: Publish GitHub Release and verify assets anonymously
        run: |
          tag="${{ steps.publish_img.outputs.tag }}"
          mkdir -p dist
          sed "s/MTEVIL_PINNED_VERSION=\"__AUTO__\"/MTEVIL_PINNED_VERSION=\"${tag}\"/" deploy/install.sh > dist/install.sh
          grep -q "MTEVIL_PINNED_VERSION=\"${tag}\"" dist/install.sh
          cp deploy/setup.py dist/setup.py
          cp deploy/mtevilctl dist/mtevilctl
          (cd dist && sha256sum install.sh setup.py mtevilctl > SHA256SUMS)

          read -r prerelease_flag latest_flag < <(python3 - "${tag}" <<'PY'
          import json, subprocess, sys
          sys.path.insert(0, "deploy")
          import setup
          tag = sys.argv[1]
          raw = subprocess.check_output(
              ["gh", "release", "list", "--limit", "100", "--json", "tagName,isDraft,isPrerelease"],
              text=True,
          )
          published = json.loads(raw)
          pre_flag, lat_flag = setup.compute_release_publish_flags(tag, published)
          print(pre_flag, lat_flag)
          PY
          )

          if gh release view "${tag}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${tag}" --json isDraft -q .isDraft)"
            assets="$(gh release view "${tag}" --json assets -q '.assets[].name')"
            existing_dir="$(mktemp -d)"
            for asset in install.sh setup.py mtevilctl SHA256SUMS; do
              if printf '%s\n' "$assets" | grep -qx "$asset"; then
                gh release download "${tag}" --pattern "$asset" --dir "$existing_dir"
                cmp "dist/$asset" "$existing_dir/$asset"
              fi
            done
            for asset in install.sh setup.py mtevilctl SHA256SUMS; do
              if ! printf '%s\n' "$assets" | grep -qx "$asset"; then
                gh release upload "${tag}" "dist/$asset"
              fi
            done
            if [ "${is_draft}" = "true" ]; then
              gh release edit "${tag}" --draft=false "${prerelease_flag}" "${latest_flag}"
            fi
          else
            notes_args=(--generate-notes)
            if [ -f "docs/releases/${tag}.md" ]; then
              notes_args=(--notes-file "docs/releases/${tag}.md")
            fi
            gh release create "${tag}" dist/install.sh dist/setup.py dist/mtevilctl dist/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "${tag}" \
              "${notes_args[@]}" \
              --draft
            gh release edit "${tag}" --draft=false "${prerelease_flag}" "${latest_flag}"
          fi

          dl_dir="$(mktemp -d)"
          trap 'rm -rf "$dl_dir"' EXIT
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${tag}/install.sh" -o "${dl_dir}/install.sh"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${tag}/setup.py" -o "${dl_dir}/setup.py"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${tag}/mtevilctl" -o "${dl_dir}/mtevilctl"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${tag}/SHA256SUMS" -o "${dl_dir}/SHA256SUMS"
          cmp -s dist/SHA256SUMS "${dl_dir}/SHA256SUMS"
          (cd "${dl_dir}" && sha256sum --strict -c SHA256SUMS)
          grep -q "MTEVIL_PINNED_VERSION=\"${tag}\"" "${dl_dir}/install.sh"
          cmp -s dist/setup.py "${dl_dir}/setup.py"
          cmp -s dist/mtevilctl "${dl_dir}/mtevilctl"

  announce:
    needs: release
    if: >-
      ${{ !cancelled() && (needs.release.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.announce_tag != '' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Announce stable or RC release in Telegram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@mtevil_chat' }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
          RELEASE_TAG: ${{ inputs.announce_tag || needs.release.outputs.tag }}
        run: python3 .github/announce_release.py "$RELEASE_TAG"
