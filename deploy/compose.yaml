name: mtevil

x-image: &image
  image: ${MTEVIL_IMAGE:-mtevil:0.1.0-alpha.1}
  build:
    context: ..
    dockerfile: Dockerfile

services:
  mtevil:
    <<: *image
    init: true
    restart: unless-stopped
    ports:
      - "${MTEVIL_BIND:-127.0.0.1}:${MTEVIL_PORT:-24443}:24443/tcp"
    volumes:
      - ./config.json:/etc/mtevil/config.json:ro
      - state:/var/lib/mtevil
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, /usr/local/bin/mtevil, health, --address, "127.0.0.1:24443"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  init:
    <<: *image
    profiles: [tools]
    command: [secret, --output, /var/lib/mtevil/proxy-secret]
    volumes:
      - state:/var/lib/mtevil
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32

volumes:
  state:
