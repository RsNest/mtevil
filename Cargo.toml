[workspace]
resolver = "2"
members = [
    "crates/harness",
    "crates/proto",
    "crates/data-plane",
    "crates/me-pool",
    "crates/egress",
    "crates/control",
    "crates/guard",
]

# Порядок в members отражает структуру ADR-000 §14.1.
# ADR-001 authorizes a test-only own-core prototype in proto/data-plane.
# Full Phase 0 and production gates remain open; see docs/specs/prototype.md.

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

# ADR-000 §14.2: «clippy/deny», парсеры без unsafe. Каждый крейт наследует через
# [lints] workspace = true; точечные исключения — только с обоснованием в комментарии.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
