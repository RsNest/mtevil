[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/harness",
    "crates/proto",
    "crates/data-plane",
    "crates/egress",
    "crates/guard",
]

# Рабочие крейты: proto (wire-кодеки), guard (replay-кэш), egress (failover backoff/jitter),
# data-plane (бинарник mtevil: direct/edge/egress), harness (тестовый стенд и валидатор отчётов).

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

# ADR-000 §14.2: «clippy/deny», парсеры без unsafe. Каждый крейт наследует через
# [lints] workspace = true; точечные исключения — только с обоснованием в комментарии.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
