[package]
name = "mtevil-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mtevil-proto = { path = "../crates/proto" }

[[bin]]
name = "fuzz_client_hello"
path = "fuzz_targets/fuzz_client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_proxy_v2"
path = "fuzz_targets/fuzz_proxy_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_obfuscated2_init"
path = "fuzz_targets/fuzz_obfuscated2_init.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_egress_preface"
path = "fuzz_targets/fuzz_egress_preface.rs"
test = false
doc = false
bench = false
